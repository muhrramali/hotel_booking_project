{% extends 'public/base.html' %}
{% block title %}Guest Login – Kutwal Dream Resort{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h2><i class="fas fa-user me-2"></i>Guest Login</h2>
    <p class="text-center text-muted mb-4">Sign in to view your bookings</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-kutwal w-100">Login</button>
    </form>
    <p class="text-center mt-3 small">No account? <a href="{% url 'guest_register' %}">Register here</a></p>
    <p class="text-center mt-2 small"><a href="{% url 'home' %}">← Back to Home</a></p>
  </div>
</div>
{% endblock %}

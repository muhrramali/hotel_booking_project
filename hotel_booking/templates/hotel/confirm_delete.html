{% extends 'hotel/base.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 text-center">
      <div style="font-size:3rem;color:#e63946;"><i class="fas fa-exclamation-triangle"></i></div>
      <h5 class="mt-3 mb-2">Are you sure?</h5>
      <p class="text-muted">You are about to delete: <strong>{{ obj }}</strong></p>
      <form method="post" class="d-flex justify-content-center gap-3 mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4"><i class="fas fa-trash me-1"></i>Yes, Delete</button>
        <a href="{% url back %}" class="btn btn-outline-secondary px-4">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}

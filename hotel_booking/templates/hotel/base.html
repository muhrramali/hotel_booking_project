<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Grand Stay Hotel{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --gold: #c9a84c; --dark: #1a1a2e; --sidebar-w: 240px; }
    body { background: #f4f6fb; font-family: 'Segoe UI', sans-serif; }
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w); min-height: 100vh; background: var(--dark);
      position: fixed; top: 0; left: 0; z-index: 100;
      display: flex; flex-direction: column;
    }
    .sidebar-brand {
      padding: 22px 18px; border-bottom: 1px solid rgba(255,255,255,.1);
      color: var(--gold); font-size: 1.1rem; font-weight: 700; letter-spacing: .5px;
    }
    .sidebar-brand i { margin-right: 8px; }
    .sidebar nav a {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 22px; color: rgba(255,255,255,.7);
      text-decoration: none; font-size: .9rem; transition: all .2s;
    }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: rgba(201,168,76,.15); color: var(--gold);
      border-left: 3px solid var(--gold);
    }
    .sidebar nav a i { width: 18px; text-align: center; }
    /* Main */
    .main-wrap { margin-left: var(--sidebar-w); min-height: 100vh; }
    .topbar {
      background: #fff; border-bottom: 1px solid #e5e7eb;
      padding: 14px 28px; display: flex; align-items: center;
      justify-content: space-between;
    }
    .topbar h4 { margin: 0; font-weight: 700; color: var(--dark); }
    .content { padding: 28px; }
    /* Cards */
    .stat-card { border: none; border-radius: 14px; padding: 22px; color: #fff; }
    .stat-card .icon { font-size: 2rem; opacity: .8; }
    .stat-card h2 { font-size: 2rem; font-weight: 800; margin: 8px 0 2px; }
    .stat-card p  { font-size: .85rem; opacity: .85; margin: 0; }
    .bg-grad-blue   { background: linear-gradient(135deg,#4361ee,#3a86ff); }
    .bg-grad-green  { background: linear-gradient(135deg,#2ec4b6,#06d6a0); }
    .bg-grad-orange { background: linear-gradient(135deg,#f77f00,#fcbf49); }
    .bg-grad-purple { background: linear-gradient(135deg,#7b2d8b,#b44be1); }
    .bg-grad-red    { background: linear-gradient(135deg,#e63946,#ff4d6d); }
    .bg-grad-gold   { background: linear-gradient(135deg,#c9a84c,#f4d03f); }
    /* Table */
    .table thead th { background: var(--dark); color: #fff; border: none; font-weight: 600; }
    .table tbody tr:hover { background: #f0f4ff; }
    .card { border: none; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
    .badge-available   { background:#d1fae5; color:#065f46; }
    .badge-occupied    { background:#fee2e2; color:#991b1b; }
    .badge-maintenance { background:#fef3c7; color:#92400e; }
    .badge-upcoming    { background:#dbeafe; color:#1e40af; }
    .badge-checkedin   { background:#d1fae5; color:#065f46; }
    .badge-checkedout  { background:#f3f4f6; color:#374151; }
    .badge-paid        { background:#d1fae5; color:#065f46; }
    .badge-pending     { background:#fef3c7; color:#92400e; }
    .badge-refunded    { background:#e0e7ff; color:#3730a3; }
    .btn-gold { background: var(--gold); color: #fff; border: none; }
    .btn-gold:hover { background: #b8912f; color:#fff; }
    .room-card { border-radius: 12px; border: 2px solid #e5e7eb; transition: all .2s; }
    .room-card:hover { border-color: var(--gold); transform: translateY(-2px); }
    .room-card.occupied  { border-color:#fca5a5; background:#fff5f5; }
    .room-card.available { border-color:#6ee7b7; background:#f0fdf4; }
  </style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand"><i class="fas fa-hotel"></i> Grand Stay</div>
  <nav class="mt-2">
    <a href="{% url 'dashboard' %}"         class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
      <i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a href="{% url 'room_list' %}"         class="{% if 'room' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-door-open"></i> Rooms</a>
    <a href="{% url 'guest_list' %}"        class="{% if 'guest' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-users"></i> Guests</a>
    <a href="{% url 'reservation_list' %}"  class="{% if 'reservation' in request.resolver_match.url_name or request.resolver_match.url_name in 'checkin,checkout' %}active{% endif %}">
      <i class="fas fa-calendar-check"></i> Reservations</a>
    <a href="{% url 'payment_list' %}"      class="{% if 'payment' in request.resolver_match.url_name %}active{% endif %}">
      <i class="fas fa-credit-card"></i> Payments</a>
  </nav>
</div>

<div class="main-wrap">
  <div class="topbar">
    <h4>{% block page_title %}Dashboard{% endblock %}</h4>
    <span class="text-muted small"><i class="fas fa-clock me-1"></i> Hotel Management System</span>
  </div>
  <div class="content">
    {% for msg in messages %}
    <div class="alert alert-{{ msg.tags|default:'info' }} alert-dismissible fade show" role="alert">
      {{ msg }} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

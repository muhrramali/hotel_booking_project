{% extends 'manage/base.html' %}
{% block page_title %}Confirm Delete{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:500px">
  <h5 class="text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Confirm Delete</h5>
  <p>Are you sure you want to delete <strong>{{ obj }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url back %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
